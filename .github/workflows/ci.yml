name: CI

# Runs only for a minor release (a tag vX.Y.0) and on demand. Patch versions
# (vX.Y.1 to vX.Y.9) are tagged without CI; every tenth version is the next
# vX.Y.0, which is released only when all jobs pass (job `release`).
on:
  push:
    tags: ["v*.*.0"]
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The CUDA backend builds without a CUDA toolkit (runtime loading).
      - run: cargo clippy -p pbsolve-py -p pbsolve-cuda --features pbsolve-py/cuda-12 -- -D warnings
      - run: cargo clippy -p pbsolve-py -p pbsolve-cuda --features pbsolve-py/cuda-13 -- -D warnings
      - run: cargo test -p pbsolve-core
      # NVRTC selection logic; the GPU tests in crates/pbsolve-cuda/tests skip without a device.
      - run: cargo test -p pbsolve-cuda --features cuda-12
      - run: cargo test -p pbsolve-cuda --features cuda-13

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install "maturin>=1.9,<2" pytest numpy scipy
      # Linux/Windows: CUDA-enabled build, which must fall back to CPU on GPU-less runners.
      - if: runner.os != 'macOS'
        run: maturin build --release --features cuda-12 -o dist
      - if: runner.os == 'macOS'
        run: maturin build --release -o dist
      - run: pip install --find-links dist pbsolve
      - run: pytest -q tests
      - run: python -m pbsolve test

  gpu:
    # Requires a self-hosted runner with an NVIDIA GPU and driver.
    if: ${{ vars.HAS_GPU_RUNNER == 'true' }}
    runs-on: [self-hosted, linux, gpu]
    steps:
      - uses: actions/checkout@v4
      - run: pip install "maturin>=1.9,<2" pytest numpy scipy nvidia-cuda-nvrtc-cu12
      - run: maturin build --release --features cuda-12 -o dist && pip install --find-links dist pbsolve
      - run: python -m pbsolve test
      - run: pytest -q tests/test_platforms.py tests/test_multigrid.py
      # The pip NVRTC is not on the loader path of a plain Rust binary: name it.
      - run: >-
          PBSOLVE_NVRTC="$(python -c 'import pbsolve; print(pbsolve._nvrtc_candidates(12)[0])')"
          cargo test -p pbsolve-cuda --features cuda-12 --test gpu

  wheels:
    # PyPI wheels: Linux x86_64 (manylinux2014), built with cuda-12, which runs
    # on the CPU without a driver; and the sdist for every other platform.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          manylinux: "2014"
          args: --release --features cuda-12 -i 3.10 3.11 3.12 3.13 3.14 -o dist
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  wheel-test:
    # A clean install of the wheel on a runner without a GPU (no checkout).
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: |
          whl=$(ls dist/*-cp$(python -c 'import sys; print("%d%d" % sys.version_info[:2])')-*.whl)
          pip install "${whl}[cuda12]"
      - run: pbsolve info && pbsolve test

  release:
    # The GitHub release of a vX.Y.0 tag, created only after the jobs above
    # passed, with the wheels and the sdist attached.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [rust, python, wheel-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."

  pypi:
    # Trusted publishing (no token): needs the publisher registered on PyPI,
    # the GitHub environment `pypi` and the repository variable PUBLISH_PYPI=true
    # (docs/PACKAGING.md).
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_PYPI == 'true' }}
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
