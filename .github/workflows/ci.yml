name: CI

# Runs only for a minor release (a tag vX.Y.0) and on demand. Patch versions
# (vX.Y.1 to vX.Y.9) are tagged without CI; every tenth version is the next
# vX.Y.0, which is released only when all jobs pass (job `release`).
on:
  push:
    tags: ["v*.*.0"]
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The CUDA backend builds without a CUDA toolkit (runtime loading).
      - run: cargo clippy -p pbsolve-py -p pbsolve-cuda --features pbsolve-py/cuda-12 -- -D warnings
      - run: cargo clippy -p pbsolve-py -p pbsolve-cuda --features pbsolve-py/cuda-13 -- -D warnings
      - run: cargo test -p pbsolve-core
      # NVRTC selection logic; the GPU tests in crates/pbsolve-cuda/tests skip without a device.
      - run: cargo test -p pbsolve-cuda --features cuda-12
      - run: cargo test -p pbsolve-cuda --features cuda-13

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install "maturin>=1.9,<2" pytest numpy scipy
      # Linux/Windows: CUDA-enabled build, which must fall back to CPU on GPU-less runners.
      - if: runner.os != 'macOS'
        run: maturin build --release --features cuda-12 -o dist
      - if: runner.os == 'macOS'
        run: maturin build --release -o dist
      - run: pip install --find-links dist pbsolve
      - run: pytest -q tests
      - run: python -m pbsolve test

  gpu:
    # Requires a self-hosted runner with an NVIDIA GPU and driver.
    if: ${{ vars.HAS_GPU_RUNNER == 'true' }}
    runs-on: [self-hosted, linux, gpu]
    steps:
      - uses: actions/checkout@v4
      - run: pip install "maturin>=1.9,<2" pytest numpy scipy nvidia-cuda-nvrtc-cu12
      - run: maturin build --release --features cuda-12 -o dist && pip install --find-links dist pbsolve
      - run: python -m pbsolve test
      - run: pytest -q tests/test_platforms.py tests/test_multigrid.py
      # The pip NVRTC is not on the loader path of a plain Rust binary: name it.
      - run: >-
          PBSOLVE_NVRTC="$(python -c 'import pbsolve; print(pbsolve._nvrtc_candidates(12)[0])')"
          cargo test -p pbsolve-cuda --features cuda-12 --test gpu

  wheels:
    # PyPI wheels, one per CPython version (3.10-3.14) and platform, each built
    # on its own runner: Linux (manylinux2014) and Windows with cuda-12, which
    # runs on the CPU without a driver; macOS without CUDA. Plus the sdist.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64, cuda: --features cuda-12}
          - {os: ubuntu-24.04-arm, target: aarch64, cuda: --features cuda-12}
          - {os: windows-latest, target: x64, cuda: --features cuda-12}
          - {os: macos-latest, target: aarch64}
          # shortcut: the last Intel macOS runner (retired in 2027); then cross-compile on macos-latest or drop Intel.
          - {os: macos-15-intel, target: x86_64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Interpreters for -i (Linux builds use the manylinux container's). Named
      # explicitly: --find-interpreter also takes the runner's CPython 3.15.
      - if: runner.os != 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: "2014"
          args: --release ${{ matrix.cuda }} -i 3.10 3.11 3.12 3.13 3.14 -o dist
      # Exactly one wheel per CPython 3.10-3.14 (no free-threaded or PyPy extras).
      - shell: bash
        run: |
          tags=$(cd dist && ls *.whl | sed -E 's/^pbsolve-[^-]+-([^-]+-[^-]+)-.*/\1/' | sort | tr '\n' ' ')
          echo "$tags"
          test "$tags" = "cp310-cp310 cp311-cp311 cp312-cp312 cp313-cp313 cp314-cp314 "
      - if: matrix.target == 'x86_64' && runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  wheel-test:
    # A clean install of each platform's wheel on a runner without a GPU (no checkout).
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      # pip picks this platform's wheel from dist only, then the extra from PyPI.
      - run: |
          pip install --no-index --find-links dist --only-binary pbsolve --no-deps pbsolve
          pip install --find-links dist "pbsolve[cuda12]"
      - run: pbsolve info && pbsolve test

  release:
    # The GitHub release of a vX.Y.0 tag, created only after the jobs above
    # passed, with the wheels and the sdist attached.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [rust, python, wheel-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."

  pypi:
    # Trusted publishing (no token): needs the publisher registered on PyPI,
    # the GitHub environment `pypi` and the repository variable PUBLISH_PYPI=true
    # (docs/PACKAGING.md).
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_PYPI == 'true' }}
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
