name: Docs

# Builds the documentation (warnings are errors) and keeps the HTML as an
# artifact, for a minor release (tag vX.Y.0, as CI) and on demand. To publish
# to GitHub Pages, set the repository variable PUBLISH_DOCS to 'true' and
# choose "GitHub Actions" as the Pages source.
on:
  push:
    tags: ["v*.*.0"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_DOCS == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
