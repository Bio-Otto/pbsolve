# Read the Docs (free tier for public repositories). The same Sphinx
# build runs in .github/workflows/docs.yml for GitHub Pages.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
