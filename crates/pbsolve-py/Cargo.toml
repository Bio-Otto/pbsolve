[package]
name = "pbsolve-py"
description = "Python bindings for pbsolve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT AND BSD-3-Clause AND BSD-2-Clause"  # links pbsolve-core and pbsolve-io
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[features]
default = []
cuda-12 = ["pbsolve-cuda/cuda-12"]
cuda-13 = ["pbsolve-cuda/cuda-13"]

[dependencies]
pbsolve-core.workspace = true
pbsolve-cuda.workspace = true
pbsolve-io.workspace = true
pyo3.workspace = true
numpy.workspace = true
