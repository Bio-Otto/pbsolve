[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "pbsolve"
description = "Fast Poisson–Boltzmann electrostatics and solvation energies (Rust core, CPU/CUDA backends, Python API)"
readme = "README.md"
license = "MIT AND BSD-3-Clause AND BSD-2-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]
dynamic = ["version"]
keywords = ["poisson-boltzmann", "electrostatics", "solvation", "mm-pbsa", "molecular-dynamics", "cuda", "openmm"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
# NVRTC for the PyPI wheels (built with cuda-12); the driver comes from the system.
# macOS wheels have no CUDA (and pip has no macOS NVRTC).
cuda12 = ["nvidia-cuda-nvrtc-cu12; sys_platform != 'darwin'"]
openmm = ["openmm>=8.0"]
test = ["pytest>=7"]

[project.scripts]
pbsolve = "pbsolve.__main__:main"

[project.urls]
Repository = "https://github.com/Bio-Otto/pbsolve"
Documentation = "https://pbsolve.readthedocs.io"
Changelog = "https://github.com/Bio-Otto/pbsolve/blob/main/CHANGELOG.md"

[tool.maturin]
manifest-path = "crates/pbsolve-py/Cargo.toml"
python-source = "python"
module-name = "pbsolve._core"
features = ["pyo3/extension-module"]
# CUDA builds add:  --features cuda-12   (or cuda-13), see recipe/build.sh

[tool.pytest.ini_options]
testpaths = ["tests"]
