{% set name = "pbsolve" %}
{% set version = "0.1.1" %}

{% set build = 0 %}
# CUDA variants get a higher build number so the solver prefers them whenever
# the __cuda virtual package (an NVIDIA driver) is present.
{% if cuda_compiler_version != "None" %}
{% set build = build + 200 %}
{% endif %}
{% set cuda_major = cuda_compiler_version.split(".")[0] if cuda_compiler_version != "None" else "0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  path: ..
  # For conda-forge use the release tarball instead:
  # url: https://github.com/Bio-Otto/pbsolve/archive/refs/tags/v{{ version }}.tar.gz
  # sha256: <fill in>

build:
  number: {{ build }}
  string: cuda{{ cuda_major }}_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ build }}  # [cuda_compiler_version != "None"]
  string: cpu_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ build }}  # [cuda_compiler_version == "None"]
  skip: true  # [py<310]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('rust') }}
    - {{ compiler('cuda') }}  # [cuda_compiler_version != "None"]
    - cargo-bundle-licenses
  host:
    - python
    - pip
    - maturin >=1.9,<2
    - cuda-version {{ cuda_compiler_version }}  # [cuda_compiler_version != "None"]
  run:
    - python
    - numpy >=1.23
    - __cuda  # [cuda_compiler_version != "None"]
    - cuda-version >={{ cuda_major }},<{{ cuda_major|int + 1 }}  # [cuda_compiler_version != "None"]
    - cuda-nvrtc  # [cuda_compiler_version != "None"]

test:
  requires:
    - pytest
  source_files:
    - tests
  imports:
    - pbsolve
  commands:
    - pbsolve info
    - python -m pbsolve.test_installation --platform CPU
    - pytest -q tests

about:
  home: https://github.com/Bio-Otto/pbsolve
  license: MIT AND BSD-3-Clause AND BSD-2-Clause
  license_file:
    - LICENSE
    - THIRD_PARTY_NOTICES.md
    - THIRDPARTY.yml
  summary: Fast Poisson-Boltzmann electrostatics and solvation energies (CPU/CUDA)
  description: |
    Poisson-Boltzmann electrostatics and solvation energies with CPU and CUDA
    backends, a Python API, readers for common simulation formats and OpenMM
    integration for MM-PBSA.

extra:
  recipe-maintainers:
    - YOUR-GITHUB-HANDLE
